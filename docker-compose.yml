# Stateless API. Raise UVICORN_WORKERS on one host, or run more api containers behind the web proxy.
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mynagari
      MINIO_ROOT_PASSWORD: mynagari-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  api:
    build: ./backend
    environment:
      CORS_ORIGINS: http://localhost:8080
      UVICORN_WORKERS: "2"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: mynagari
      MINIO_SECRET_KEY: mynagari-minio
      MINIO_BUCKET: mynagari
      MINIO_SECURE: "false"
    volumes:
      - apidata:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - minio

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  miniodata:
  apidata:
